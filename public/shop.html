<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop All Poster Sets — Highstreet Society</title>
<meta name="description" content="Browse all A4 poster sets. 6 designs per set on 3mm board. COD available all over Bangladesh.">
<meta property="og:title" content="Shop All Poster Sets — Highstreet Society">
<meta property="og:image" content="/images/hero-banner.jpg">
<link rel="icon" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div class="announce" id="announce"></div>
<header class="site" id="hdr"></header>
<div class="mmenu" id="mmenu"></div>
<main class="wrap">
  <div class="shophead"><h1>ALL POSTER SETS</h1><p id="count"></p></div>
  <div class="toolbar">
    <div class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="Search sets, vibes, tags… (e.g. pink, anime, set 03)"></div>
    <select id="sort">
      <option value="newest">Newest</option>
      <option value="popular">Most popular</option>
      <option value="featured">Featured</option>
      <option value="price-asc">Price: Low → High</option>
      <option value="price-desc">Price: High → Low</option>
      <option value="name">Name A–Z</option>
    </select>
    <select id="avail"><option value="">All</option><option value="1">In stock only</option></select>
  </div>
  <div class="chips" id="catchips"></div>
  <div class="grid cols-4" id="grid"></div>
  <div id="more" style="text-align:center;padding:30px 0 10px"></div>
</main>
<footer class="site" id="ftr"></footer>
<nav class="tabbar" id="tabbar"></nav>
<script src="/js/store.js?v=7a28fc41"></script>
<script src="/js/shop.js?v=374d7d0c"></script>
