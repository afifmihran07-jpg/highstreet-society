<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highstreet Society</title>
<link rel="icon" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css?v=787354f0">
</head>
<body>
<div class="announce" id="announce"></div>
<header class="site" id="hdr"></header>
<div class="mmenu" id="mmenu"></div>
<main class="wrap" id="content"></main>
<footer class="site" id="ftr"></footer>
<nav class="tabbar" id="tabbar"></nav>
<script src="/js/store.js?v=7a28fc41"></script>
<script>
(async function(){
  const H=HSS; await H.renderLayout('');
  const key=location.pathname.split('/').pop();
  const el=document.getElementById('content');
  try{
    const c=await H.api('/api/content/'+encodeURIComponent(key));
    document.title=c.title+' — Highstreet Society';
    el.innerHTML=`<div class="shophead"><h1>${H.esc(c.title).toUpperCase()}</h1></div>
      <div class="panel prose">${H.esc(c.body).split(/\n\n+/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}</div>`;
  }catch(e){
    el.innerHTML=`<div style="padding:40px 0">${H.empty('📄','Page not found','This page is not available yet.','<a class="btn btn-lime" href="/">Back to home</a>')}</div>`;
  }
})();
</script>
</body>
</html>
